spring.datasource.url=jdbc:mysql://localhost:3306/booking_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=booking_user
spring.datasource.password=booking_pass

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=change-this-to-a-long-random-string-at-least-32-chars
app.jwt.expiration-ms=86400000